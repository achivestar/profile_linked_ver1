<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프리미엄 링크 프로필</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><!-- 1. 다크 모드 토글 버튼 --><div class="top-controls"><button id="themeToggle" class="icon-btn">🌙</button></div><!-- 프로필 영역 --><header class="profile-section"><img src="./image/leaf.png" alt="프로필 이미지" class="profile-img"><h1 class="profile-name">Grid & Flex</h1><p class="profile-bio">디자인과 코딩으로 가치를 만듭니다.</p></header><!-- 링크 버튼 영역 --><main class="links-section"><a href="#" class="link-btn">🎨 포트폴리오 웹사이트</a> <a href="#" class="link-btn">📸 인스타그램 (Grid & Flex)</a><!-- 2. 모달 팝업 호출 버튼 --> <button id="openModalBtn" class="link-btn highlight">✉️ 비즈니스 명함 및 문의</button></main><!-- 3. 미니 갤러리 (CSS Grid 적용) --><section class="gallery-section"><h2 class="section-title">Recent Works</h2><div class="card-grid"><div class="card"><img src="./image/image1.png" alt="작업물 1"></div><div class="card"><img src="./image/image2.png" alt="작업물 2"></div><div class="card"><img src="./image/image3.png" alt="작업물 3"></div><div class="card"><img src="./image/image4.png" alt="작업물 4"></div></div></section></div><!-- 비즈니스 명함 모달 창 --><div id="contactModal" class="modal-overlay"><div class="modal-content"><button id="closeModalBtn" class="close-btn">&times;</button><h2>Business Card</h2><p><strong>Email:</strong> hello@example.com</p><p><strong>Phone:</strong> 010-1234-5678</p><p>협업 및 프로젝트 문의는 이메일로 부탁드립니다. 24시간 내로 답변드리겠습니다.</p></div></div><script src="script.js"></script></body></html>
